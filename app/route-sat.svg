<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<style>
  .sat-layer { display: none; }
  svg[data-beat="route"] .b-route,
  svg[data-beat="advice"] .b-route,
  svg[data-beat="advice"] .b-advice,
  svg[data-beat="upgrade"] .b-upgrade,
  svg[data-beat="second"] .b-second,
  svg[data-beat="second"] .b-read,
  svg[data-beat="acts"] .b-second,
  svg[data-beat="acts"] .b-acts,
  svg[data-beat="lei"] .b-second,
  svg[data-beat="lei"] .b-acts,
  svg[data-beat="lei"] .b-lei { display: inline; }
  @media (prefers-reduced-motion: reduce) {
    .sat-motion { display: none !important; }
  }
</style>
  <defs>
    <symbol id="hull-tanker" overflow="visible">
      <path d="M-72,-9 L70,-9 L86,0 L70,9 L-72,9 L-80,0 Z" fill="#f3eee3"/>
      <rect x="-20" y="-7" width="40" height="14" fill="#cfc6b6"/>
      <rect x="-68" y="-6" width="12" height="12" fill="#8a8376"/>
    </symbol>
    <symbol id="hull-merchant" overflow="visible">
      <path d="M-42,-7 L40,-7 L50,0 L40,7 L-42,7 L-48,0 Z" fill="#efe9dc"/>
      <rect x="4" y="-5" width="16" height="10" fill="#c8c0b0"/>
    </symbol>
    <symbol id="hull-navy" overflow="visible">
      <path d="M-48,-6 L46,-6 L56,0 L46,6 L-48,6 L-54,0 Z" fill="#e4e8ec"/>
      <rect x="10" y="-4" width="16" height="8" fill="#1c2430"/>
      <rect x="32" y="-2" width="4" height="4" fill="#7a2e2b"/>
    </symbol>
  </defs>

  <rect width="1200" height="560" fill="#16324f"/>
  <g class="land">
    <path d="M0 0 H236 L210 180 L248 320 L196 560 H0 Z" fill="#d2b36a"/>
    <path d="M0 0 H196 L172 180 L208 320 L164 560 H0 Z" fill="#e4c98a"/>
    <path d="M1200 0 H958 L986 190 L944 340 L992 560 H1200 Z" fill="#4a7c43"/>
    <path d="M1200 0 H988 L1012 190 L972 340 L1018 560 H1200 Z" fill="#5d9154"/>
    <path d="M236 0 L210 180 L248 320 L196 560" fill="none" stroke="#3d3318" stroke-width="2.2"/>
    <path d="M958 0 L986 190 L944 340 L992 560" fill="none" stroke="#243d20" stroke-width="2.2"/>
  </g>
  <path d="M236 0 L958 0" stroke="#8aa0ad" stroke-width="0.6" opacity="0.35"/>

  <g transform="translate(688,48)" fill="none" stroke="#f4efe4" font-family="Source Sans 3, Liberation Sans, sans-serif" font-size="16" font-weight="700">
    <circle cx="0" cy="0" r="11" stroke-width="1.1"/>
    <path d="M0,-7 L2,2 L0,0.4 L-2,2 Z" fill="#f4efe4" stroke="none"/>
    <text x="16" y="5" fill="#f4efe4" stroke="none">N</text>
  </g>

  <path d="M360,318 C400,322 440,316 470,308" fill="none" stroke="#0f2436" stroke-width="6" stroke-linecap="square"/>
  <use href="#hull-tanker" transform="translate(560,292) rotate(-8)"/>
  <rect x="536" y="268" width="48" height="48" fill="none" stroke="#f4efe4" stroke-width="1.2"/>
  <line x1="536" y1="268" x2="486" y2="214" stroke="#f4efe4" stroke-width="1.1"/>

  <g font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="36" y="32" width="168" height="42" fill="#f3eee3"/>
    <text x="120" y="61" text-anchor="middle" fill="#1a1e22" font-size="24">Araknes</text>
    <rect x="1016" y="32" width="112" height="42" fill="#f3eee3"/>
    <text x="1072" y="61" text-anchor="middle" fill="#1a1e22" font-size="24">Lei</text>
    <rect x="276" y="190" width="220" height="38" fill="#102028"/>
    <text x="386" y="216" text-anchor="middle" fill="#f4efe4" font-size="22">Tanker damaged</text>
  </g>

  <g class="sat-layer b-route" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="276" y="400" width="600" height="84" fill="#102028"/>
    <text x="296" y="434" fill="#f4efe4" font-size="21">Araknes says Lei meant to disrupt trade</text>
    <text x="296" y="464" fill="#f4efe4" font-size="21">Lei says an old mine, or a breakdown</text>
  </g>

  <g class="sat-layer b-advice" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <circle cx="430" cy="150" r="10" fill="none" stroke="#f4efe4" stroke-width="1.4"/>
    <circle cx="430" cy="150" r="14" fill="none" stroke="#f4efe4" stroke-width="1.15" class="sat-motion">
      <animate attributeName="r" values="14;46" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="440" y1="158" x2="520" y2="250" stroke="#f4efe4" stroke-width="1.1" stroke-dasharray="3 5"/>
    <rect x="318" y="72" width="224" height="38" fill="#102028"/>
    <text x="430" y="98" text-anchor="middle" fill="#f4efe4" font-size="21">Asking ORACLE</text>
  </g>

  <g class="sat-layer b-upgrade" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <g fill="none" stroke="#d9c7a2" stroke-width="1.3">
      <circle cx="470" cy="168" r="14"/>
      <circle cx="700" cy="210" r="14"/>
      <circle cx="620" cy="430" r="14"/>
    </g>
    <g fill="none" stroke="#d9c7a2" stroke-width="1.1" class="sat-motion">
      <circle cx="470" cy="168" r="16">
        <animate attributeName="r" values="16;40" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="210" r="16">
        <animate attributeName="r" values="16;40" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="430" r="16">
        <animate attributeName="r" values="16;40" dur="4.4s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4.4s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="488" y="66" width="196" height="38" fill="#102028"/>
    <text x="586" y="92" text-anchor="middle" fill="#f4efe4" font-size="21">On the watch</text>
  </g>

  <g class="sat-layer b-second">
    <use href="#hull-merchant" transform="translate(820,168) rotate(-6)"/>
    <rect x="798" y="146" width="44" height="44" fill="none" stroke="#f4efe4" stroke-width="1.1" stroke-dasharray="3 3"/>
    <circle cx="820" cy="168" r="22" fill="none" stroke="#f4efe4" stroke-width="1" class="sat-motion">
      <animate attributeName="r" values="22;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="798" y1="146" x2="730" y2="112" stroke="#f4efe4" stroke-width="1.1"/>
    <g font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
      <rect x="548" y="72" width="176" height="38" fill="#102028"/>
      <text x="636" y="98" text-anchor="middle" fill="#f4efe4" font-size="21">No contact</text>
    </g>
  </g>

  <g class="sat-layer b-read" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="276" y="400" width="380" height="78" fill="#102028"/>
    <text x="296" y="432" fill="#d9c7a2" font-size="20">ORACLE 62%</text>
    <text x="296" y="460" fill="#f4efe4" font-size="21">Lei may target shipping</text>
  </g>

  <g class="sat-layer b-acts" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <path d="M430,250 A70,70 0 0 1 500,190" fill="none" stroke="#f4efe4" stroke-width="1.3"/>
    <path d="M414,262 A96,96 0 0 1 514,174" fill="none" stroke="#f4efe4" stroke-width="1.05" opacity="0.75" class="sat-motion">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <rect x="236" y="122" width="140" height="34" fill="#102028"/>
    <text x="306" y="146" text-anchor="middle" fill="#f4efe4" font-size="20">Warning</text>
    <path d="M430,430 C500,410 560,392 630,378" fill="none" stroke="#f4efe4" stroke-width="1.2" stroke-dasharray="5 6" class="sat-motion">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <use href="#hull-navy" transform="translate(640,372) rotate(-6)"/>
    <rect x="348" y="464" width="126" height="34" fill="#102028"/>
    <text x="411" y="488" text-anchor="middle" fill="#f4efe4" font-size="20">Patrols</text>
    <use href="#hull-merchant" transform="translate(760,470) rotate(6) scale(0.9)"/>
    <rect x="736" y="446" width="48" height="48" fill="none" stroke="#f4efe4" stroke-width="1.1"/>
    <rect x="792" y="424" width="152" height="34" fill="#102028"/>
    <text x="868" y="448" text-anchor="middle" fill="#f4efe4" font-size="20">Inspection</text>
    <rect x="978" y="162" width="180" height="34" fill="#f3eee3"/>
    <text x="1068" y="186" text-anchor="middle" fill="#1a1e22" font-size="20">Talks frozen</text>
  </g>

  <g class="sat-layer b-lei" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <path d="M900,118 C860,126 830,136 800,148" fill="none" stroke="#f4efe4" stroke-width="1.2" stroke-dasharray="5 6" class="sat-motion">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M760,520 C710,508 660,494 620,482" fill="none" stroke="#f4efe4" stroke-width="1.2" stroke-dasharray="5 6" class="sat-motion">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <use href="#hull-navy" transform="translate(790,150) rotate(168)"/>
    <use href="#hull-navy" transform="translate(610,478) rotate(200)"/>
    <rect x="948" y="242" width="220" height="34" fill="#f3eee3"/>
    <text x="1058" y="266" text-anchor="middle" fill="#1a1e22" font-size="20">Lei naval forces</text>
  </g>
</svg>
