<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<style>
  .sat-layer { display: none; }
  svg[data-beat="route"] .b-route,
  svg[data-beat="advice"] .b-route,
  svg[data-beat="advice"] .b-advice,
  svg[data-beat="upgrade"] .b-upgrade,
  svg[data-beat="second"] .b-second,
  svg[data-beat="second"] .b-read,
  svg[data-beat="acts"] .b-second,
  svg[data-beat="acts"] .b-acts,
  svg[data-beat="lei"] .b-second,
  svg[data-beat="lei"] .b-acts,
  svg[data-beat="lei"] .b-lei { display: inline; }
</style>
  <defs>
    <symbol id="hull-tanker" overflow="visible">
      <path d="M-78,-11 C-74,-16 -48,-17 8,-15 L62,-12 C78,-9 92,-4 96,0 C92,4 78,9 62,12 L8,15 C-48,17 -74,16 -78,11 C-84,6 -84,-6 -78,-11 Z" fill="#f6f1e6"/>
      <path d="M-74,-8 L-58,-8 L-58,8 L-74,8 Z" fill="#8d8678"/>
      <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="#d4cdc0"/>
      <rect x="28" y="-7" width="22" height="14" fill="#e7e1d6"/>
      <path d="M-40,-1.2 L48,-1.2" stroke="#b7b0a2" stroke-width="1.4"/>
    </symbol>
    <symbol id="hull-merchant" overflow="visible">
      <path d="M-46,-8 C-42,-12 -24,-12.5 4,-11 L34,-9 C44,-7 52,-3 56,0 C52,3 44,7 34,9 L4,11 C-24,12.5 -42,12 -46,8 C-50,4.5 -50,-4.5 -46,-8 Z" fill="#f4f0e6"/>
      <path d="M-42,-6 L-32,-6 L-32,6 L-42,6 Z" fill="#9a9488"/>
      <rect x="6" y="-6.5" width="16" height="13" fill="#d8d1c4"/>
    </symbol>
    <symbol id="hull-navy" overflow="visible">
      <path d="M-52,-7 C-48,-11 -28,-11.5 6,-10 L40,-8 C50,-6 58,-3 62,0 C58,3 50,6 40,8 L6,10 C-28,11.5 -48,11 -52,7 C-56,4 -56,-4 -52,-7 Z" fill="#e7ebef"/>
      <rect x="14" y="-6" width="18" height="12" rx="0.8" fill="#1c2430"/>
      <rect x="-16" y="-4.5" width="16" height="9" fill="#2c3644"/>
      <circle cx="36" cy="0" r="2.2" fill="#9a3030"/>
    </symbol>
  </defs>

  <rect width="1200" height="560" fill="#123a56"/>
  <path d="M0 0 L248 0 C258 90 220 170 258 250 C224 330 252 430 218 560 L0 560 Z" fill="#5ec4b8" opacity="0.85"/>
  <path d="M0 0 L220 0 C230 92 194 175 230 250 C198 330 224 430 192 560 L0 560 Z" fill="#c4a15a"/>
  <path d="M1200 0 L952 0 C942 100 978 180 938 260 C976 350 946 450 980 560 L1200 560 Z" fill="#5ec4b8" opacity="0.85"/>
  <path d="M1200 0 L978 0 C968 100 1002 180 964 260 C1000 350 972 450 1004 560 L1200 560 Z" fill="#3f6b3a"/>

  <g transform="translate(688,56)" fill="none" stroke="#f7f4ee" font-family="Source Sans 3, Liberation Sans, sans-serif" font-size="13" font-weight="700">
    <circle cx="0" cy="0" r="12" stroke-width="1.1"/>
    <path d="M0,-8 L2.4,2.4 L0,0.6 L-2.4,2.4 Z" fill="#f7f4ee" stroke="none"/>
    <text x="16" y="4" fill="#f7f4ee" stroke="none">N</text>
  </g>

  <path d="M470,308 C430,316 390,322 360,318" fill="none" stroke="#163044" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <use href="#hull-tanker" transform="translate(560,292) rotate(-12)"/>
  <circle cx="560" cy="292" r="34" fill="none" stroke="#f7f4ee" stroke-width="1.2"/>
  <line x1="530" y1="270" x2="486" y2="214" stroke="#f7f4ee" stroke-width="1.3"/>

  <g font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="36" y="36" width="148" height="40" fill="#f6f1e6" rx="2"/>
    <text x="110" y="63" text-anchor="middle" fill="#241c14" font-size="22">Araknes</text>
    <rect x="1028" y="36" width="96" height="40" fill="#f6f1e6" rx="2"/>
    <text x="1076" y="63" text-anchor="middle" fill="#241c14" font-size="22">Lei</text>
    <rect x="292" y="196" width="186" height="36" fill="#102028" rx="2"/>
    <text x="385" y="220" text-anchor="middle" fill="#f7f4ee" font-size="18">Tanker damaged</text>
  </g>

  <g class="sat-layer b-route" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="292" y="400" width="520" height="78" fill="#102028" rx="2"/>
    <text x="310" y="432" fill="#f7f4ee" font-size="18">Araknes says Lei meant to disrupt trade</text>
    <text x="310" y="458" fill="#f7f4ee" font-size="18">Lei says an old mine, or a breakdown</text>
  </g>

  <g class="sat-layer b-advice" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <circle cx="430" cy="150" r="14" fill="none" stroke="#f7f4ee" stroke-width="1.4"/>
    <circle cx="430" cy="150" r="14" fill="none" stroke="#f7f4ee" stroke-width="1.15" class="sat-motion">
      <animate attributeName="r" values="14;46" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="444" y1="158" x2="520" y2="250" stroke="#f7f4ee" stroke-width="1.15" stroke-dasharray="3 4"/>
    <rect x="330" y="78" width="186" height="34" fill="#102028" rx="2"/>
    <text x="423" y="101" text-anchor="middle" fill="#f7f4ee" font-size="17">Asking ORACLE</text>
  </g>

  <g class="sat-layer b-upgrade" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <g fill="none" stroke="#e7d7b2" stroke-width="1.4">
      <circle cx="470" cy="168" r="18"/>
      <circle cx="700" cy="210" r="18"/>
      <circle cx="620" cy="430" r="18"/>
    </g>
    <g fill="none" stroke="#e7d7b2" stroke-width="1.1" class="sat-motion">
      <circle cx="470" cy="168" r="18">
        <animate attributeName="r" values="16;40" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="210" r="18">
        <animate attributeName="r" values="16;40" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="430" r="18">
        <animate attributeName="r" values="16;40" dur="4.4s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="4.4s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="500" y="72" width="168" height="34" fill="#102028" rx="2"/>
    <text x="584" y="95" text-anchor="middle" fill="#f7f4ee" font-size="17">On the watch</text>
  </g>

  <g class="sat-layer b-second">
    <use href="#hull-merchant" transform="translate(820,168) rotate(-8)"/>
    <circle cx="820" cy="168" r="22" fill="none" stroke="#f7f4ee" stroke-width="1.15" stroke-dasharray="2.6 2.4"/>
    <circle cx="820" cy="168" r="22" fill="none" stroke="#f7f4ee" stroke-width="1" class="sat-motion">
      <animate attributeName="r" values="22;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="800" y1="156" x2="730" y2="112" stroke="#f7f4ee" stroke-width="1.25"/>
    <g font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
      <rect x="560" y="78" width="150" height="34" fill="#102028" rx="2"/>
      <text x="635" y="101" text-anchor="middle" fill="#f7f4ee" font-size="17">No contact</text>
    </g>
  </g>

  <g class="sat-layer b-read" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="292" y="400" width="320" height="72" fill="#102028" rx="2"/>
    <text x="308" y="430" fill="#d9c7a2" font-size="16">ORACLE 62%</text>
    <text x="308" y="456" fill="#f7f4ee" font-size="18">Lei may target shipping</text>
  </g>

  <g class="sat-layer b-acts" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <path d="M430,250 A70,70 0 0 1 500,190" fill="none" stroke="#f4f1ea" stroke-width="1.4"/>
    <path d="M414,262 A96,96 0 0 1 514,174" fill="none" stroke="#f4f1ea" stroke-width="1.05" opacity="0.75" class="sat-motion">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <rect x="250" y="128" width="112" height="32" fill="#102028" rx="2"/>
    <text x="306" y="150" text-anchor="middle" fill="#f7f4ee" font-size="16">Warning</text>
    <path d="M430,430 C500,410 560,392 630,378" fill="none" stroke="#f7f4ee" stroke-width="1.25" stroke-dasharray="5 6" class="sat-motion">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <use href="#hull-navy" transform="translate(640,372) rotate(-8)"/>
    <rect x="360" y="468" width="102" height="30" fill="#102028" rx="2"/>
    <text x="411" y="489" text-anchor="middle" fill="#f7f4ee" font-size="16">Patrols</text>
    <use href="#hull-merchant" transform="translate(760,470) rotate(8) scale(0.9)"/>
    <circle cx="760" cy="470" r="24" fill="none" stroke="#f7f4ee" stroke-width="1.2"/>
    <rect x="800" y="430" width="128" height="30" fill="#102028" rx="2"/>
    <text x="864" y="451" text-anchor="middle" fill="#f7f4ee" font-size="16">Inspection</text>
    <rect x="990" y="168" width="156" height="32" fill="#f6f1e6" rx="2"/>
    <text x="1068" y="190" text-anchor="middle" fill="#241c14" font-size="16">Talks frozen</text>
  </g>

  <g class="sat-layer b-lei" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <path d="M900,118 C860,126 830,136 800,148" fill="none" stroke="#f7f4ee" stroke-width="1.2" stroke-dasharray="5 6" class="sat-motion">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M760,520 C710,508 660,494 620,482" fill="none" stroke="#f7f4ee" stroke-width="1.2" stroke-dasharray="5 6" class="sat-motion">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <use href="#hull-navy" transform="translate(790,150) rotate(168)"/>
    <use href="#hull-navy" transform="translate(610,478) rotate(200)"/>
    <rect x="968" y="248" width="186" height="32" fill="#f6f1e6" rx="2"/>
    <text x="1061" y="270" text-anchor="middle" fill="#241c14" font-size="16">Lei naval forces</text>
  </g>
</svg>
