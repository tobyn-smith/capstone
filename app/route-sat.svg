<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
<style>
  .sat-layer { display: none; }
  svg[data-beat="route"] .b-route,
  svg[data-beat="advice"] .b-route,
  svg[data-beat="advice"] .b-advice,
  svg[data-beat="upgrade"] .b-upgrade,
  svg[data-beat="second"] .b-second,
  svg[data-beat="second"] .b-read,
  svg[data-beat="acts"] .b-second,
  svg[data-beat="acts"] .b-acts,
  svg[data-beat="lei"] .b-second,
  svg[data-beat="lei"] .b-acts,
  svg[data-beat="lei"] .b-lei { display: inline; }
</style>
  <defs>
    <symbol id="hull-tanker" overflow="visible">
      <path d="M-72,-9 L70,-9 L86,0 L70,9 L-72,9 L-80,0 Z" fill="#f3eee3"/>
      <rect x="-20" y="-7" width="40" height="14" fill="#cfc6b6"/>
      <rect x="-68" y="-6" width="12" height="12" fill="#8a8376"/>
    </symbol>
    <symbol id="hull-merchant" overflow="visible">
      <path d="M-42,-7 L40,-7 L50,0 L40,7 L-42,7 L-48,0 Z" fill="#efe9dc"/>
      <rect x="4" y="-5" width="16" height="10" fill="#c8c0b0"/>
    </symbol>
    <symbol id="hull-navy" overflow="visible">
      <path d="M-48,-6 L46,-6 L56,0 L46,6 L-48,6 L-54,0 Z" fill="#e4e8ec"/>
      <rect x="10" y="-4" width="16" height="8" fill="#1c2430"/>
      <rect x="32" y="-2" width="4" height="4" fill="#7a2e2b"/>
    </symbol>
  </defs>

  <rect width="1200" height="560" fill="#16324f"/>
  <path d="M0 0 H236 L210 180 L248 320 L196 560 H0 Z" fill="#c4a15a"/>
  <path d="M0 0 H196 L172 180 L208 320 L164 560 H0 Z" fill="#d4c09a"/>
  <path d="M1200 0 H958 L986 190 L944 340 L992 560 H1200 Z" fill="#2f4a3a"/>
  <path d="M1200 0 H988 L1012 190 L972 340 L1018 560 H1200 Z" fill="#3d5a3c"/>
  <path d="M236 0 L958 0" stroke="#8aa0ad" stroke-width="0.6" opacity="0.35"/>

  <g transform="translate(688,48)" fill="none" stroke="#f4efe4" font-family="Source Sans 3, Liberation Sans, sans-serif" font-size="13" font-weight="700">
    <circle cx="0" cy="0" r="11" stroke-width="1.1"/>
    <path d="M0,-7 L2,2 L0,0.4 L-2,2 Z" fill="#f4efe4" stroke="none"/>
    <text x="16" y="4" fill="#f4efe4" stroke="none">N</text>
  </g>

  <path d="M360,318 C400,322 440,316 470,308" fill="none" stroke="#0f2436" stroke-width="6" stroke-linecap="square"/>
  <use href="#hull-tanker" transform="translate(560,292) rotate(-8)"/>
  <rect x="536" y="268" width="48" height="48" fill="none" stroke="#f4efe4" stroke-width="1.2"/>
  <line x1="536" y1="268" x2="486" y2="214" stroke="#f4efe4" stroke-width="1.1"/>

  <g font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="36" y="36" width="148" height="36" fill="#f3eee3"/>
    <text x="110" y="60" text-anchor="middle" fill="#1a1e22" font-size="20">Araknes</text>
    <rect x="1028" y="36" width="96" height="36" fill="#f3eee3"/>
    <text x="1076" y="60" text-anchor="middle" fill="#1a1e22" font-size="20">Lei</text>
    <rect x="292" y="196" width="186" height="32" fill="#102028"/>
    <text x="385" y="218" text-anchor="middle" fill="#f4efe4" font-size="16">Tanker damaged</text>
  </g>

  <g class="sat-layer b-route" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="292" y="408" width="520" height="72" fill="#102028"/>
    <text x="310" y="438" fill="#f4efe4" font-size="17">Araknes says Lei meant to disrupt trade</text>
    <text x="310" y="464" fill="#f4efe4" font-size="17">Lei says an old mine, or a breakdown</text>
  </g>

  <g class="sat-layer b-advice" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <circle cx="430" cy="150" r="10" fill="none" stroke="#f4efe4" stroke-width="1.4"/>
    <line x1="440" y1="158" x2="520" y2="250" stroke="#f4efe4" stroke-width="1.1" stroke-dasharray="3 5"/>
    <rect x="330" y="78" width="186" height="32" fill="#102028"/>
    <text x="423" y="100" text-anchor="middle" fill="#f4efe4" font-size="16">Asking ORACLE</text>
  </g>

  <g class="sat-layer b-upgrade" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <g fill="none" stroke="#d9c7a2" stroke-width="1.3">
      <circle cx="470" cy="168" r="14"/>
      <circle cx="700" cy="210" r="14"/>
      <circle cx="620" cy="430" r="14"/>
    </g>
    <rect x="500" y="72" width="168" height="32" fill="#102028"/>
    <text x="584" y="94" text-anchor="middle" fill="#f4efe4" font-size="16">On the watch</text>
  </g>

  <g class="sat-layer b-second">
    <use href="#hull-merchant" transform="translate(820,168) rotate(-6)"/>
    <rect x="798" y="146" width="44" height="44" fill="none" stroke="#f4efe4" stroke-width="1.1" stroke-dasharray="3 3"/>
    <line x1="798" y1="146" x2="730" y2="112" stroke="#f4efe4" stroke-width="1.1"/>
    <g font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
      <rect x="560" y="78" width="150" height="32" fill="#102028"/>
      <text x="635" y="100" text-anchor="middle" fill="#f4efe4" font-size="16">No contact</text>
    </g>
  </g>

  <g class="sat-layer b-read" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <rect x="292" y="408" width="320" height="66" fill="#102028"/>
    <text x="308" y="436" fill="#d9c7a2" font-size="15">ORACLE 62%</text>
    <text x="308" y="460" fill="#f4efe4" font-size="17">Lei may target shipping</text>
  </g>

  <g class="sat-layer b-acts" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <path d="M430,250 A70,70 0 0 1 500,190" fill="none" stroke="#f4efe4" stroke-width="1.3"/>
    <rect x="250" y="128" width="112" height="28" fill="#102028"/>
    <text x="306" y="148" text-anchor="middle" fill="#f4efe4" font-size="15">Warning</text>
    <path d="M430,430 C500,410 560,392 630,378" fill="none" stroke="#f4efe4" stroke-width="1.2" stroke-dasharray="5 6"/>
    <use href="#hull-navy" transform="translate(640,372) rotate(-6)"/>
    <rect x="360" y="468" width="102" height="28" fill="#102028"/>
    <text x="411" y="488" text-anchor="middle" fill="#f4efe4" font-size="15">Patrols</text>
    <use href="#hull-merchant" transform="translate(760,470) rotate(6) scale(0.9)"/>
    <rect x="736" y="446" width="48" height="48" fill="none" stroke="#f4efe4" stroke-width="1.1"/>
    <rect x="800" y="430" width="128" height="28" fill="#102028"/>
    <text x="864" y="450" text-anchor="middle" fill="#f4efe4" font-size="15">Inspection</text>
    <rect x="990" y="168" width="156" height="28" fill="#f3eee3"/>
    <text x="1068" y="188" text-anchor="middle" fill="#1a1e22" font-size="15">Talks frozen</text>
  </g>

  <g class="sat-layer b-lei" font-family="Source Sans 3, Liberation Sans, sans-serif" font-weight="700">
    <path d="M900,118 C860,126 830,136 800,148" fill="none" stroke="#f4efe4" stroke-width="1.2" stroke-dasharray="5 6"/>
    <path d="M760,520 C710,508 660,494 620,482" fill="none" stroke="#f4efe4" stroke-width="1.2" stroke-dasharray="5 6"/>
    <use href="#hull-navy" transform="translate(790,150) rotate(168)"/>
    <use href="#hull-navy" transform="translate(610,478) rotate(200)"/>
    <rect x="968" y="248" width="186" height="28" fill="#f3eee3"/>
    <text x="1061" y="268" text-anchor="middle" fill="#1a1e22" font-size="15">Lei naval forces</text>
  </g>
</svg>
