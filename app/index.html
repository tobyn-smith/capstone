<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File 26-441 · Araknes Commission of Inquiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="computer-only">
    <p class="brand">Araknes Commission of Inquiry</p>
    <h1>Open this file on a computer.</h1>

  <div class="site">
    <header class="banner">
      <div class="banner-row">
        <img class="flag flag-lg" src="flag-araknes.svg" alt="" width="64" height="43">
        <div>
          <p class="gov">The Government of Araknes</p>
          <p class="commission">Commission of Inquiry</p>
        </div>
        <p class="ref">File 26-441</p>
      </div>
      <ul class="party-line" aria-label="The parties">
        <li><img class="flag" src="flag-araknes.svg" alt="">Araknes</li>
        <li><img class="flag" src="flag-lei.svg" alt="">Lei</li>
      </ul>
    </header>
    <div class="frame">
      <nav class="rail" id="rail" aria-label="Index to the file"></nav>
      <article class="sheet">
        <header class="mast" id="mast"></header>
        <main id="app">
          <p>Opening the file.</p>
        </main>
        <footer class="imprint">
          <p>File 26-441</p>
        </footer>
      </article>
    </div>
  </div>
  <script type="module" src="game.js"></script>
