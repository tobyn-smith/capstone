<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INTL 6010 · Research Methods</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@400;500&family=Merriweather:wght@400;700&family=Oswald:wght@300;500&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="computer-only class-gate">
    <img class="uga-logo" src="uga-logo.png" alt="University of Georgia" width="1024" height="158">
    <p class="brand">INTL 6010</p>
    <h1>Open this file on a computer.</h1>
    <p>It is laid out across a full screen. A phone will not open it.</p>
  </div>
  <div id="before" class="before"></div>
  <div class="site" hidden>
    <header class="banner">
      <div class="banner-row">
        <img class="arms" src="arms-araknes.svg" alt="" width="52" height="64">
        <div>
          <p class="gov">The Government of Araknes</p>
          <p class="commission">Commission of Inquiry</p>
        </div>
        <p class="ref"><span>File</span>26-441</p>
      </div>
      <ul class="party-line" aria-label="The parties">
        <li class="party-kicker">Parties</li>
        <li><img class="flag" src="flag-araknes.svg" alt="">Araknes</li>
        <li><img class="flag" src="flag-lei.svg" alt="">Lei</li>
      </ul>
    </header>
    <div class="frame">
      <nav class="rail" id="rail" aria-label="Index to the file"></nav>
      <article class="sheet">
        <header class="mast" id="mast"></header>
        <main id="app">
          <p>Opening the file.</p>
        </main>
        <footer class="imprint">
          <p>Draft · File 26-441</p>
        </footer>
      </article>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
